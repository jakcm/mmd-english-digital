plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
}

// 注意：API Key 不在此构建时注入，也不写入源码或 APK。
// Key 由用户在 App 的「设置」页手动填写，仅保存在本机（SharedPreferences 明文）。

android {
    namespace = "com.mmd.englishdigital"
    compileSdk = 34

    defaultConfig {
        applicationId = "com.mmd.englishdigital"
        minSdk = 24
        targetSdk = 34
        versionCode = 15
        versionName = "3.1"
        // 只保留目标设备需要的 ABI（电视为 arm64-v8a）。
        // TFLite 运行时自带 4 个 ABI 的原生库；TEN VAD 只有 arm64-v8a 预编译库（532KB）。
        ndk { abiFilters "arm64-v8a" }
        externalNativeBuild {
            cmake {
                // TEN VAD 的 JNI 桥
                cppFlags ""
            }
        }
    }
    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            minifyEnabled = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation("androidx.core:core-ktx:1.12.0")
    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("com.google.android.material:material:1.11.0")
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0")

    // ---- 火山引擎官方端到端实时语音 SDK（POC 验证用，见 PocDialogActivity）----
    // 内含: 线性AEC3 + 神经网络AEC(sami::AecModel, DeepVQE) + Kalman + 麦克风阵列选择
    //      + ByteNN 推理引擎 + 帧级VAD + 录音/播放/WebSocket 全链路
    // 官方说明: "Dialog SDK 内置 AEC 能力...硬件 AEC 为强制开启，不会自打断"
    implementation("com.bytedance.speechengine:speechengine_tob:0.0.15.0.1-bugfix")
    // 本地 VAD（WebRTC VAD GMM）；2.0.9 用 Kotlin 1.9.21 构建，与本项目兼容
    implementation("com.cloudflare.realtimekit.android-vad:webrtc:2.0.9")

    // ---- 软件回声消除（WebRTC AEC3）----
    // 说明：官方坐标 cn.enaium.webrtc.aec3:webrtc-aec3-kmp:1.0.3 的 AAR 写死了
    // minCompileSdk=37，本工程 AGP 8.4.0 / compileSdk 34 无法直接依赖。
    // 因此把 AAR 解包后的 classes.jar（含 Kotlin 2.2 API）与 arm64-v8a 的
    // libwebrtc_aec3_jni.so 直接内置到工程里（app/libs 与 app/src/main/jniLibs）。
    // 需要支持其它 ABI（如 x86_64 模拟器）时，从同一 AAR 的 jni/<abi>/ 再拷入即可；
    // 缺失 ABI 时 Aec3Processor 会捕获 UnsatisfiedLinkError 并自动降级。
    implementation(files("libs/aec3-classes.jar"))

    // ---- 神经网络回声消除（DTLN-aec，微软 AEC-Challenge 第 3 名，MIT）----
    // 线性 AEC3 在本电视上 ERLE≈0（回声路径非线性，互相关≈0）；离线实测 DTLN-aec
    // 在相同录音上可达 23.9~29.8dB 抑制，且最小规格（128，7MB）即可，故用它替代 AEC3。
    implementation("org.tensorflow:tensorflow-lite:2.14.0")
}
